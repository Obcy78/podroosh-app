name: PodrooshDb
services:
  postgresDb:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: podUser
      POSTGRES_PASSWORD: podroosh12
      POSTGRES_DB: podrooshDB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_container
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8085:85"
    depends_on:
      - postgresDb
volumes:
  postgres_data:
